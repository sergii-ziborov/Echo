name: Echo

options:
  bundleIdPrefix: com.sergiiziborov
  developmentLanguage: en
  deploymentTarget:
    iOS: "18.0"
  createIntermediateGroups: true
  generateEmptyDirectories: true

settings:
  base:
    SWIFT_VERSION: "6.0"
    # One version for the phone app and its embedded watch app: App Store
    # validation rejects an archive whose two bundles disagree.
    MARKETING_VERSION: 1.0.0
    CURRENT_PROJECT_VERSION: 19
    DEVELOPMENT_TEAM: XMS5ZC28UJ
    IPHONEOS_DEPLOYMENT_TARGET: "18.0"
    TARGETED_DEVICE_FAMILY: "1,2"
    SUPPORTS_MACCATALYST: NO
    ENABLE_USER_SCRIPT_SANDBOXING: YES
    CLANG_ANALYZER_LOCALIZABILITY_NONLOCALIZED: YES

targets:
  Echo:
    type: application
    platform: iOS
    sources:
      - path: Echo
        excludes:
          - Resources/Info.plist
      - path: Shared          # phone ↔ watch protocol, wrist maps and relic rules
    dependencies:
      - target: EchoWatch     # embeds the watch app under Watch/
    info:
      path: Echo/Resources/Info.plist
      properties:
        CFBundleDisplayName: ECHO
        CFBundleDevelopmentRegion: en
        CFBundleLocalizations: [en, ru]
        CFBundleShortVersionString: "$(MARKETING_VERSION)"
        CFBundleVersion: "$(CURRENT_PROJECT_VERSION)"
        ITSAppUsesNonExemptEncryption: false
        LSApplicationCategoryType: public.app-category.puzzle-games
        NSHumanReadableCopyright: "© 2026 Sergii Ziborov. All rights reserved."
        UIApplicationSupportsIndirectInputEvents: true
        UILaunchScreen:
          UIColorName: LaunchBackground
        UIRequiresFullScreen: true
        UIStatusBarStyle: UIStatusBarStyleLightContent
        UIUserInterfaceStyle: Dark
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
        UISupportedInterfaceOrientations~ipad:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationPortraitUpsideDown
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.sergiiziborov.Echo
        PRODUCT_NAME: Echo
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_CFBundleDisplayName: ECHO
        INFOPLIST_KEY_LSApplicationCategoryType: public.app-category.puzzle-games
        INFOPLIST_KEY_UIApplicationSupportsIndirectInputEvents: YES
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        INFOPLIST_KEY_UIRequiresFullScreen: YES
        INFOPLIST_KEY_UIStatusBarStyle: UIStatusBarStyleLightContent
        INFOPLIST_KEY_UIUserInterfaceStyle: Dark
        INFOPLIST_KEY_UISupportedInterfaceOrientations: UIInterfaceOrientationPortrait
        INFOPLIST_KEY_UISupportedInterfaceOrientations_iPad: "UIInterfaceOrientationPortrait UIInterfaceOrientationPortraitUpsideDown UIInterfaceOrientationLandscapeLeft UIInterfaceOrientationLandscapeRight"
        CODE_SIGN_STYLE: Automatic
        SWIFT_STRICT_CONCURRENCY: complete

  # Single-target watchOS companion. It runs the same rules (Echo/Simulation)
  # and the portable renderers, and talks to the phone through Shared/.
  EchoWatch:
    type: application
    platform: watchOS
    deploymentTarget: "11.0"
    sources:
      - path: EchoWatch
        excludes:
          - Info.plist
      - path: Shared
      - path: Echo/Simulation
      - path: Echo/Arena/Graphics/TrailRenderer.swift
      - path: Echo/Arena/Sky
      - path: Echo/Arena/Graphics/VisualStyle.swift
      - path: Echo/Arena/Graphics/AbilityGlyph.swift
      - path: Echo/Arena/Geometry/RockShape.swift
      - path: Echo/Arena/Textures/BitmapCanvas.swift
      - path: Echo/Arena/Textures/SpriteTextures.swift
      - path: Echo/Arena/Textures/RockPainter.swift
      - path: Echo/Arena/Textures/RockSurfaces.swift
    info:
      path: EchoWatch/Info.plist
      properties:
        CFBundleDisplayName: ECHO
        CFBundleDevelopmentRegion: en
        CFBundleLocalizations: [en, ru]
        CFBundleShortVersionString: "$(MARKETING_VERSION)"
        CFBundleVersion: "$(CURRENT_PROJECT_VERSION)"
        WKApplication: true
        WKCompanionAppBundleIdentifier: com.sergiiziborov.Echo
        WKRunsIndependentlyOfCompanionApp: false
        ITSAppUsesNonExemptEncryption: false
        NSHumanReadableCopyright: "© 2026 Sergii Ziborov. All rights reserved."
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.sergiiziborov.Echo.watchkitapp
        PRODUCT_NAME: EchoWatch
        TARGETED_DEVICE_FAMILY: "4"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        CODE_SIGN_STYLE: Automatic
        SWIFT_STRICT_CONCURRENCY: complete

  EchoTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - path: EchoTests
    dependencies:
      - target: Echo
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.sergiiziborov.EchoTests
        GENERATE_INFOPLIST_FILE: YES
        SWIFT_STRICT_CONCURRENCY: complete

schemes:
  EchoWatch:
    build:
      targets:
        EchoWatch: all
    run:
      config: Debug
    archive:
      config: Release
  Echo:
    build:
      targets:
        Echo: all
        EchoTests: [test]
    run:
      config: Debug
    test:
      config: Debug
      gatherCoverageData: true
      targets:
        - EchoTests
    profile:
      config: Release
    analyze:
      config: Debug
    archive:
      config: Release
